# Integración continua: es el workflow que se ata a las reglas de protección de rama.
#
# Disparadores:
#   - `pull_request` hacia `main` o `develop` → verificación rápida (chromium) del cambio propuesto.
#   - `push` a `main` → verificación completa (todos los navegadores) de lo ya integrado.
#   - `merge_group` → misma verificación al entrar en la cola de merge.
#
# Las pruebas no se escriben acá: se delegan al workflow reutilizable `e2e.yml`, que es la
# única definición de "cómo se corren las E2E" en todo el repositorio.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

# Un push nuevo sobre la misma rama cancela la corrida anterior; en `main` no se cancela,
# para no perder el historial de verificación de commits ya integrados.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Comprobaciones baratas: fallan en segundos y evitan gastar un runner con navegadores.
  compilacion:
    name: Compilación
    if: ${{ github.event.pull_request.draft != true }}
    # Runner autoalojado del laboratorio. Se deja comentado como ejemplo de cómo apuntar a uno
    # propio: la etiqueta `i7infra-dev` es la que identifica a ese runner en el repositorio.
    # runs-on: [self-hosted, i7infra-dev]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Preparar el SDK de .NET
        # En el runner autoalojado el SDK ya estaba instalado; en los runners de GitHub hay que
        # pedirlo, porque la imagen no garantiza la versión que necesita el proyecto.
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar
        run: dotnet restore Lab-E2E.WebBlazor.sln

      - name: Compilar con los avisos tratados como error
        run: dotnet build Lab-E2E.WebBlazor.sln --configuration Release --no-restore -warnaserror

      - name: Listar las pruebas (detecta que el descubrimiento funciona)
        # Equivale al `playwright test --list` del runner de JavaScript: no levanta navegadores
        # ni la aplicación, solo comprueba que NUnit encuentre los casos.
        run: >-
          dotnet test tests/MovilidadUrbana.E2ETests
          --configuration Release --no-build --list-tests

  e2e:
    name: E2E
    needs: [compilacion]
    # Un PR se valida rápido con un solo navegador; `main` y la cola de merge, con todos.
    uses: ./.github/workflows/e2e.yml
    with:
      navegadores: ${{ github.event_name == 'pull_request' && 'chromium' || 'chromium,firefox,webkit,mobile-chrome' }}
      referencia: ${{ github.event.pull_request.head.sha || github.sha }}

  # Deja el resultado a la vista en el propio pull request.
  comentario-en-pr:
    name: Comentar en el PR
    needs: e2e
    if: >-
      ${{ always()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    # Runner autoalojado del laboratorio. Se deja comentado como ejemplo de cómo apuntar a uno
    # propio: la etiqueta `i7infra-dev` es la que identifica a ese runner en el repositorio.
    # runs-on: [self-hosted, i7infra-dev]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        env:
          RESULTADO: ${{ needs.e2e.outputs.resultado || needs.e2e.result }}
        with:
          script: |
            const resultado = process.env.RESULTADO;
            const ok = resultado === 'success';
            const marca = '<!-- e2e-playwright -->';
            const corrida = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const cuerpo = [
              marca,
              `### ${ok ? '✅' : '❌'} Pruebas E2E — \`${resultado}\``,
              '',
              `Commit: \`${context.payload.pull_request.head.sha.slice(0, 7)}\``,
              `Corrida: ${corrida}`,
              '',
              ok
                ? 'Todas las pruebas de extremo a extremo pasaron.'
                : 'Hay pruebas en rojo. Los TRX de cada configuración están en los artefactos **resultados-\*** de la corrida.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const numero = context.payload.pull_request.number;
            const comentarios = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: numero, per_page: 100,
            });
            const previo = comentarios.find((c) => c.body?.includes(marca));

            // Se actualiza el comentario existente en vez de agregar uno por corrida.
            if (previo) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previo.id, body: cuerpo });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: numero, body: cuerpo });
            }

  # Único job que las reglas de protección de rama necesitan exigir: resume a todos los demás.
  ci-ok:
    name: CI aprobada
    needs: [compilacion, e2e]
    if: always()
    # Runner autoalojado del laboratorio. Se deja comentado como ejemplo de cómo apuntar a uno
    # propio: la etiqueta `i7infra-dev` es la que identifica a ese runner en el repositorio.
    # runs-on: [self-hosted, i7infra-dev]
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar que ningún job previo falló
        shell: bash
        run: |
          set -euo pipefail
          echo "compilacion: ${{ needs.compilacion.result }}"
          echo "e2e: ${{ needs.e2e.result }}"
          for resultado in "${{ needs.compilacion.result }}" "${{ needs.e2e.result }}"; do
            case "$resultado" in
              success|skipped) ;;
              *) echo "::error::La CI no está en verde."; exit 1 ;;
            esac
          done
