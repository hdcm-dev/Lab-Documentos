# Entrega y verificación del cascarón de la demo del framework en iOS (Concepts/Framework-Concept/Demo).
#
# Qué hace: compila el cascarón (contenedor nativo .NET MAUI) en Release para el simulador de iOS (iossimulator-arm64,
# firma ad hoc, sin perfiles ni secretos), lo instala en un simulador, lo abre, espera la marca «FC-MARCA
# primer-render» en el registro unificado y sube como artefactos el .app comprimido, la bitácora, la captura, el video,
# el TPR y el manifiesto de herramientas (qué se usó, versión por versión).
#
# NO es parte de la compuerta del PR: «fw-ok» (framework-concept-demo.yml, expediente 0001, folio 035, P6.2/P6.3) sigue
# siendo el único check requerido. Esto es un workflow aparte de entrega, como el de referencia en que se basa (el CD de
# iOS de Ejemplo_Maui_Hibrida). Corre al llegar a main un cambio de la demo, y a mano.
#
# Runner: macos-15 de GitHub (el repositorio es público: los minutos de macOS no se cobran). Puede correr también en el
# runner propio con la etiqueta macos15 (VM de la Mac mini) si el PO lo decide: basta cambiar «runs-on».
#
# Cadena de herramientas: TODO fijo, nada de «la última» (regla del PO). Se borra lo que trae la imagen (otros Xcode y
# el .NET preinstalado) y se instala exactamente lo que dice la receta de versiones:
#   Concepts/Framework-Concept/Demo/ci/receta/ios/versiones.env (una sola fuente para este workflow, la VM del runner y
#   el escenario de agente; ahí está también por qué los workloads van por archivo de reversión). El paso RECETA la
#   carga a $GITHUB_ENV y ci/receta/ios/verificar.sh compara lo instalado contra ella antes de compilar.

# Xcode viene del instalador en Google Drive que usa la referencia (Apple no publica Xcode sin cuenta). Riesgo: el
# archivo depende de un tercero y de la cuota de descargas de Drive; por eso su SHA-256 está fijado (XCODE_XIP_SHA256) y
# se COMPRUEBA antes de expandirlo (corta si no coincide), y después se verifica la compilación de Xcode (XCODE_BUILD).
# El .xip se guarda en la caché de GitHub Actions (ver el bloque XCODE) para no depender de la cuota de Drive.
# Las dependencias de gdown no van fijadas por hash: sus versiones quedan en el manifiesto y el .xip lo cubre el SHA-256.
#
# La imagen macos-15 NO es fija: GitHub la actualiza (versión menor de macOS, runtimes, CoreSimulator). El manifiesto
# registra ImageOS/ImageVersion. El runtime iOS 26.0.1 se toma de la imagen; la rama que lo baja si falta
# (-downloadPlatform -buildVersion) no se ejercitó todavía. Los demás runtimes de la imagen no se borran.

name: framework-concept-ios

on:
  push:
    branches:
      - main
    paths:
      - 'Concepts/Framework-Concept/Demo/**'
      - '.github/workflows/framework-concept-ios.yml'
      - '!**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framework-concept-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  DEMO: Concepts/Framework-Concept/Demo
  PROYECTO: src/FrameworkConcept.Shell
  BUNDLE_ID: com.frameworkconcept.demo
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  CI: "true"

  # BUILD
  CONFIGURACION: Release
  RID: iossimulator-arm64
  TFM: net10.0-ios

jobs:
  ios-simulador:
    if: github.repository == 'hdcm-dev/Lab-Documentos'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Runner
        run: |
          echo "Arquitectura: $(uname -m)"
          echo "CPU: $(sysctl -n machdep.cpu.brand_string)"
          echo "Núcleos: $(sysctl -n hw.ncpu)"
          sw_vers
          df -h /

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (node24)
        with:
          persist-credentials: false

      - name: "RECETA. Versiones fijas a $GITHUB_ENV"
        run: |
          set -euo pipefail
          grep -E '^[A-Z_][A-Z0-9_]*=' "$DEMO/ci/receta/ios/versiones.env" | tee -a "$GITHUB_ENV"

      - name: Carpeta de evidencia
        run: |
          EVIDENCIA="$RUNNER_TEMP/evidencia"
          mkdir -p "$EVIDENCIA"
          echo "EVIDENCIA=$EVIDENCIA" >> "$GITHUB_ENV"

      # ── XCODE ────────────────────────────────────────────────────────────────────────────────────────────────
      # Caché del instalador .xip (actions/cache). El Xcode sigue siendo el .xip FIJO de Drive, no el de la imagen; la
      # caché sólo evita depender de la cuota de descargas de Drive («Too many users have viewed or downloaded…»).
      #   - Clave: XCODE_VERSION + XCODE_FILE_INSTALLER + XCODE_GOOGLE_FILE_INSTALLER_ID + XCODE_XIP_SHA256. Si cambia
      #     cualquiera, es otra entrada y se vuelve a bajar. Sin restore-keys, a propósito: una coincidencia parcial
      #     traería otro Xcode.
      #   - Venga de Drive o de la caché, el .xip se valida con el SHA-256 exacto antes de expandirlo; se guarda sólo
      #     después de validarlo y expandirlo (nunca se cachea una página de error de Drive).
      #   - Tope de GitHub: 10 GB de caché por repositorio (el .xip pesa ~2,6 GB: caben tres o cuatro entradas); pasado
      #     el tope borra las menos usadas, y borra toda entrada que no se lee en 7 días. En ambos casos la corrida
      #     siguiente baja de Drive y la vuelve a llenar.
      #   - Alcance por rama: lo guardado en main lo leen todas las ramas; lo guardado en otra rama, sólo esa rama.
      #     Tras un cambio de Xcode conviene que la primera corrida sea sobre main.
      #   - En runner.temp, fuera del checkout: la ruta entra en la versión de la caché y no se mezcla con el código.
      - name: "XCODE. Restaurar el instalador desde la caché"
        id: cache-xip
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4 (node24)
        with:
          path: ${{ runner.temp }}/xcode-xip
          key: xcode-xip-${{ env.XCODE_VERSION }}-${{ env.XCODE_FILE_INSTALLER }}-${{ env.XCODE_GOOGLE_FILE_INSTALLER_ID }}-${{ env.XCODE_XIP_SHA256 }}

      - name: "XCODE. Bajar el instalador de Google Drive (sin caché)"
        if: steps.cache-xip.outputs.cache-hit != 'true'
        run: |
          set -uo pipefail
          pipx install "gdown==${GDOWN_VERSION}" || exit 1
          { python3 --version; pipx --version; gdown --version; pipx runpip gdown freeze; } > "$EVIDENCIA/gdown-entorno.txt" 2>&1
          XIP="$RUNNER_TEMP/xcode-xip/$XCODE_FILE_INSTALLER"
          mkdir -p "$(dirname "$XIP")"
          echo "Caché del Xcode: no está (clave ${{ steps.cache-xip.outputs.cache-primary-key }}); se baja de Google Drive"
          rc=0
          gdown "$XCODE_GOOGLE_FILE_INSTALLER_ID" -O "$XIP" 2>&1 | tee "$RUNNER_TEMP/gdown.log" || rc=$?
          if [ "$rc" -ne 0 ] || [ ! -s "$XIP" ]; then
            if grep -q "Too many users have viewed or downloaded" "$RUNNER_TEMP/gdown.log"; then
              echo "::error title=Xcode::Drive sin cuota y sin caché del Xcode (Google Drive limitó la descarga de ${XCODE_FILE_INSTALLER}; reintentar en hasta 24 h)"
            else
              echo "::error title=Xcode::Drive no entregó ${XCODE_FILE_INSTALLER} y no hay caché del Xcode (gdown salió con $rc; ver el log de arriba)"
            fi
            exit 1
          fi
          ls -lh "$XIP"

      - name: "XCODE. Validar (SHA-256) y expandir el instalador"
        run: |
          set -euxo pipefail
          XIP="$RUNNER_TEMP/xcode-xip/$XCODE_FILE_INSTALLER"
          ORIGEN="${{ steps.cache-xip.outputs.cache-hit == 'true' && 'caché' || 'Google Drive' }}"
          echo "Instalador desde ${ORIGEN}: $(stat -f%z "$XIP") bytes"
          [ -s "$EVIDENCIA/gdown-entorno.txt" ] || echo "gdown no se instaló: el .xip vino de la caché" > "$EVIDENCIA/gdown-entorno.txt"
          ( cd "$(dirname "$XIP")" && shasum -a 256 "$XCODE_FILE_INSTALLER" ) | tee "$EVIDENCIA/xcode-xip.sha256"
          echo "origen: $ORIGEN" >> "$EVIDENCIA/xcode-xip.sha256"
          ( cd "$(dirname "$XIP")" && echo "${XCODE_XIP_SHA256}  ${XCODE_FILE_INSTALLER}" | shasum -a 256 -c - ) || {
            echo "::error title=Xcode::El instalador desde ${ORIGEN} no es el fijado (SHA-256 distinto de XCODE_XIP_SHA256)"; exit 1; }
          # Lo preinstalado se borra antes de expandir: libera espacio y asegura que no quede otro Xcode a mano.
          sudo rm -rf /Applications/Xcode*.app
          cd "$RUNNER_TEMP"
          xip --expand "$XIP"
          test -d Xcode.app
          df -h /

      - name: "XCODE. Guardar el instalador en la caché"
        if: steps.cache-xip.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4 (node24)
        with:
          path: ${{ runner.temp }}/xcode-xip
          key: ${{ steps.cache-xip.outputs.cache-primary-key }}

      - name: "XCODE. Instalar y fijar"
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/xcode-xip"   # ya está guardado o vino de la caché: se libera el disco
          cd "$RUNNER_TEMP"
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app"
          sudo mv Xcode.app "$XCODE_PATH"
          sudo ln -s "$XCODE_PATH" /Applications/Xcode.app
          sudo xcode-select --switch "$XCODE_PATH"
          sudo xcodebuild -license accept
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version
          xcodebuild -version | grep -q "Build version ${XCODE_BUILD}" || { echo "ERROR: no es Xcode ${XCODE_BUILD}"; exit 1; }
          echo "MD_APPLE_SDK_ROOT=$XCODE_PATH" >> "$GITHUB_ENV"
          df -h /

      # ── SIMULADOR ────────────────────────────────────────────────────────────────────────────────────────────
      - name: "SIMULADOR. Runtime iOS fijo y dispositivo"
        run: |
          set -euxo pipefail
          # El servicio de simuladores quedó levantado con el Xcode anterior de la imagen: se reinicia para que tome
          # el fijado (si no, «simctl bootstatus» queda colgado).
          sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
          xcrun simctl list runtimes
          if ! xcrun simctl list runtimes | grep -q "iOS ${IOS_RUNTIME} (.* - ${IOS_RUNTIME_BUILD})"; then
            sudo xcodebuild -downloadPlatform iOS -buildVersion "$IOS_RUNTIME_BUILD"
          fi
          xcrun simctl list runtimes
          RUNTIME_ID="$(xcrun simctl list runtimes | grep -- "- ${IOS_RUNTIME_BUILD})" | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+' | head -1)"
          test -n "$RUNTIME_ID"
          UDID="$(xcrun simctl create fc-humo "$SIM_DEVICE_TYPE" "$RUNTIME_ID")"
          xcrun simctl boot "$UDID"
          perl -e 'alarm 600; exec @ARGV' xcrun simctl bootstatus "$UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      # ── DOTNET ───────────────────────────────────────────────────────────────────────────────────────────────
      - name: "DOTNET. SDK por versión exacta"
        run: |
          set -euxo pipefail
          # El .NET de la imagen se quita del camino: sólo queda el que se instala acá.
          sudo rm -rf "$HOME/.dotnet" /usr/local/share/dotnet
          curl -fsSL "$DOTNET_INSTALL_SCRIPT_URL" -o "$RUNNER_TEMP/dotnet-install.sh"
          shasum -a 256 "$RUNNER_TEMP/dotnet-install.sh" | tee "$EVIDENCIA/dotnet-install.sh.sha256"
          bash "$RUNNER_TEMP/dotnet-install.sh" --version "$DOTNET_VERSION" --install-dir "$HOME/.dotnet"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          export PATH="$HOME/.dotnet:$PATH"
          dotnet --list-sdks
          cd "$DEMO" && test "$(dotnet --version)" = "$DOTNET_VERSION"

      # ── WORKLOADS ────────────────────────────────────────────────────────────────────────────────────────────
      - name: "WORKLOADS. ios y maui-ios por manifiestos fijos"
        run: |
          set -euxo pipefail
          printf '{\n  "microsoft.net.sdk.ios": "%s",\n  "microsoft.net.sdk.maui": "%s"\n}\n' \
            "$WORKLOAD_IOS_MANIFEST" "$WORKLOAD_MAUI_MANIFEST" > "$RUNNER_TEMP/workloads-rollback.json"
          cat "$RUNNER_TEMP/workloads-rollback.json" | tee "$EVIDENCIA/workloads-rollback.json"
          dotnet workload config --update-mode manifests
          dotnet workload install ios maui-ios --from-rollback-file "$RUNNER_TEMP/workloads-rollback.json"
          dotnet workload list
          dotnet workload list | grep -qE "^ios +${WORKLOAD_IOS_MANIFEST} " || { echo "ERROR: el workload ios no es ${WORKLOAD_IOS_MANIFEST}"; exit 1; }
          dotnet workload list | grep -qE "^maui-ios +${WORKLOAD_MAUI_MANIFEST} " || { echo "ERROR: el workload maui-ios no es ${WORKLOAD_MAUI_MANIFEST}"; exit 1; }

      - name: "RECETA. Verificar lo instalado contra versiones.env"
        run: bash "$DEMO/ci/receta/ios/verificar.sh" | tee "$EVIDENCIA/receta-verificar.txt"

      - name: "MANIFIESTO. Traza de herramientas"
        run: |
          {
            echo "# Herramientas de la corrida ${GITHUB_RUN_ID} (${GITHUB_SHA})"
            echo "## Imagen del runner (no fija)"; echo "ImageOS=${ImageOS:-?} ImageVersion=${ImageVersion:-?}"
            echo "## Receta (versiones.env)"; grep -E '^[A-Z_]+=' "$DEMO/ci/receta/ios/versiones.env"
            echo "## Verificación de la receta"; cat "$EVIDENCIA/receta-verificar.txt"
            echo "## sw_vers"; sw_vers
            echo "## uname"; uname -a
            echo "## xcode-select -p"; xcode-select -p
            echo "## xcodebuild -version"; xcodebuild -version
            echo "## xcodebuild -showsdks"; xcodebuild -showsdks
            echo "## xcrun simctl list runtimes"; xcrun simctl list runtimes
            echo "## Instalador de Xcode (SHA-256)"; cat "$EVIDENCIA/xcode-xip.sha256"
            echo "## dotnet-install.sh (SHA-256)"; cat "$EVIDENCIA/dotnet-install.sh.sha256"
            echo "## Entorno de gdown (python, pipx, gdown y sus dependencias)"; cat "$EVIDENCIA/gdown-entorno.txt"
            echo "## dotnet --info"; (cd "$DEMO" && dotnet --info)
            echo "## dotnet workload list"; dotnet workload list
            echo "## global.json"; cat "$DEMO/global.json"
            echo "## MauiVersion"; grep -o '<MauiVersion>[^<]*' "$DEMO/Directory.Build.props"
            echo "## Versión del cascarón"; grep -oE '<Application(Display)?Version>[^<]*' "$DEMO/versionado/version-cascaron.props"
          } | tee "$EVIDENCIA/manifiesto-herramientas.txt"

      # ── BUILD ────────────────────────────────────────────────────────────────────────────────────────────────
      - name: "VERSIONADO. Del cascarón (version-cascaron.props)"
        run: |
          P="$DEMO/versionado/version-cascaron.props"
          VER="$(sed -n 's/.*<ApplicationDisplayVersion>\(.*\)<\/ApplicationDisplayVersion>.*/\1/p' "$P")"
          NUM="$(sed -n 's/.*<ApplicationVersion>\(.*\)<\/ApplicationVersion>.*/\1/p' "$P")"
          echo "Cascarón ${VER} (${NUM})"
          echo "NOMBRE_ZIP=$(date -u +%Y%m%d%H%M)_${VER}_${NUM}_${BUNDLE_ID}.app.zip" >> "$GITHUB_ENV"

      - name: "BUILD. Release para el simulador"
        working-directory: ${{ env.DEMO }}
        run: |
          set -euxo pipefail
          dotnet build "$PROYECTO" -c "$CONFIGURACION" -f "$TFM" \
            -p:FcDestinos="$TFM" -p:RuntimeIdentifier="$RID" -v minimal
          APP="$PWD/$PROYECTO/bin/$CONFIGURACION/$TFM/$RID/FrameworkConcept.Shell.app"
          test -d "$APP"
          codesign -dv "$APP" 2>&1 | head -20
          # Entitlements: en el simulador pueden ir en la firma o en la sección __TEXT,__entitlements del binario.
          ENT="$( { codesign -d --entitlements - --xml "$APP" 2>/dev/null; \
                    otool -s __TEXT __entitlements "$APP/FrameworkConcept.Shell" 2>/dev/null \
                      | perl -ne 'next unless s/^[0-9a-f]{8,16}\s+//; for (split) { print scalar reverse pack("H*", $_) if /^[0-9a-f]{8}$/ }'; } || true)"
          # (otool muestra la sección en palabras de 32 bits little-endian: se invierte cada palabra para leer el plist)
          printf '%s\n' "$ENT" | tee "$EVIDENCIA/entitlements.txt"
          grep -q keychain-access-groups "$EVIDENCIA/entitlements.txt" || { echo "ERROR: falta keychain-access-groups en el .app"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" "$APP/Info.plist"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: "BUILD. Zip del .app"
        run: |
          cd "$(dirname "$APP")"
          zip -qry "$EVIDENCIA/$NOMBRE_ZIP" "$(basename "$APP")"
          ls -lh "$EVIDENCIA/$NOMBRE_ZIP"

      # ── HUMO ─────────────────────────────────────────────────────────────────────────────────────────────────
      - name: "HUMO. Instalar, abrir y esperar el primer render"
        timeout-minutes: 20
        run: bash "$DEMO/scripts/humo-ios.sh" "$APP" "$SIM_UDID" "$EVIDENCIA/humo" 180

      - name: "HUMO. TPR en el resumen"
        if: always()
        run: |
          {
            echo "### Cascarón iOS (simulador)"
            echo '```'
            cat "$EVIDENCIA/humo/tpr.txt" 2>/dev/null || echo "sin marca primer-render"
            xcodebuild -version | tr '\n' ' '; echo
            dotnet workload list | grep -E '^(ios|maui-ios) ' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir evidencia
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (node24)
        with:
          name: framework-concept-ios-${{ github.run_id }}
          path: ${{ runner.temp }}/evidencia/
          if-no-files-found: warn
          retention-days: 14
