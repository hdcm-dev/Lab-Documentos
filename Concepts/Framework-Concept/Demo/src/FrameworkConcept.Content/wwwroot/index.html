<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- P3 — CSP del dictamen: sólo el origen local; WebAssembly sin eval de JS ('wasm-unsafe-eval');
         connect-src acotado al origen local (la red del contenido pasa por el puente, no por fetch);
         sin plugins. No hay 'unsafe-inline': ni scripts ni estilos en línea en este archivo ni en las
         páginas (por eso el .csproj apaga las huellas, que traerían un importmap en línea). -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; object-src 'none'" />
    <title>Movilidad urbana</title>
    <!-- C-2 de E01 — <base href="/"> y la etiqueta de _framework/hybridwebview.js. Ese archivo NO viene en
         el paquete: lo sirve el HybridWebView del cascarón (es el transporte del puente, P3). -->
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <script src="_framework/hybridwebview.js"></script>
    <script src="js/puente.js"></script>
</head>

<body>
    <div id="app">
        <p class="fc-cargando">Cargando…</p>
    </div>

    <div id="blazor-error-ui">
        Ocurrió un error no controlado.
        <a href="." class="reload">Recargar</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
