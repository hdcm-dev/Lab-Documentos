[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pieza-lab"
version = "1.4.0"
requires-python = ">=3.12"
dependencies = ["six==1.17.0"]
[project.urls]
Source = "https://github.com/ejemplo-lab/pieza"

[tool.setuptools.packages.find]
where = ["src"]
