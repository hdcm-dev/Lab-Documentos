# Ejemplo de N7 (no lo lee A.17, que busca .github/workflows/ci.yml): la CI como árbitro.
# Corre la MISMA compuerta que el hook, en la MISMA imagen que el devcontainer.
# Acciones fijadas por SHA completo (resuelto con `git ls-remote` el 2026-10-07);
# el comentario conserva la etiqueta para que Dependabot pueda proponer la subida.
name: compuerta
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  compuerta:
    runs-on: ubuntu-24.04
    # Misma receta que .devcontainer (N5): base por digest + EditorConfig.
    container: ghcr.io/org/imagen-ci@sha256:<digest-publicado-por-el-pipeline-de-la-imagen>
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0            # --base necesita la historia para comparar con main
      - name: Compuerta del PR (sólo lo cambiado + todo el grafo)
        if: github.event_name == 'pull_request'
        run: tools/compuerta.sh --base "origin/${{ github.base_ref }}"
      - name: Compuerta completa (main)
        if: github.event_name == 'push'
        run: tools/compuerta.sh

# Variante SIN imagen propia: las acciones de setup leen los MISMOS archivos que
# la compuerta verifica, así la versión no se repite en el workflow.
